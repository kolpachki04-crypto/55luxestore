<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>55 LUXESTORE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Хедер сайта -->
  <header class="header">
    <a href="index.html" class="logo">
      <span class="brand-name">55 LUXESTORE</span>
    </a>
    <div class="header-controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Поиск товаров..." oninput="filterProducts()">
      <a href="cart.html" class="cart-icon" title="Перейти в корзину">
        🛒 <span id="cart-count">0</span>
      </a>
    </div>
  </header>

  <main class="container">
    <!-- Фильтры и сортировка -->
    <div class="controls-bar">
      <nav class="categories">
        <button class="category-btn filter-btn active" onclick="filterCategory('all', event)">Все</button>
        <button class="category-btn filter-btn" onclick="filterCategory('bags', event)">Сумки</button>
        <button class="category-btn filter-btn" onclick="filterCategory('watches', event)">Часы</button>
        <button class="category-btn filter-btn" onclick="filterCategory('sets', event)">Наборы</button>
      </nav>

      <div class="sort-container">
        <select id="sortSelect" class="sort-select" onchange="filterProducts()">
          <option value="default">По умолчанию</option>
          <option value="price-asc">Сначала дешевле</option>
          <option value="price-desc">Сначала дороже</option>
        </select>
      </div>
    </div>

    <!-- Сетка с товарами -->
    <div id="productGrid" class="products-grid">
      <!-- Товары динамически загружаются из script.js -->
    </div>
  </main>

  <!-- Модальное окно просмотра товара -->
  <div id="productModal" class="modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeProductModal()">&times;</span>
      <div class="modal-body" id="modalBody">
        <!-- Контент загружается через JS -->
      </div>
    </div>
  </div>

  <!-- Контейнер для toast-уведомлений -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="script.js"></script>
</body>
</html>
