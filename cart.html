<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина — 55 LUXESTORE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo">
      <span class="brand-name">55 LUXESTORE</span>
    </a>
    <a href="index.html" class="back-link">← Назад в магазин</a>
  </header>

  <main class="container">
    <h1 class="page-title">Ваш заказ</h1>

    <div class="cart-page-layout">
      <!-- Список выбранных товаров -->
      <section class="cart-section">
        <h2>Выбранные товары</h2>
        <div id="cartPageItems" class="cart-page-items">
          <!-- Товары отрисуются из JS -->
        </div>
      </section>

      <!-- Форма оформления заказа -->
      <section class="checkout-section">
        <h2>Оформление</h2>
        <form id="checkoutForm" onsubmit="sendOrderToTelegram(event)">
          
          <div class="form-group">
            <label for="userName">Ваше имя *</label>
            <input type="text" id="userName" required placeholder="Иван">
          </div>

          <div class="form-group">
            <label for="userPhone">Номер телефона *</label>
            <input type="tel" id="userPhone" required placeholder="+7 (999) 000-00-00">
          </div>

          <div class="form-group">
            <label>Способ получения *</label>
            <div class="radio-group">
              <label><input type="radio" name="deliveryType" value="Доставка" checked onclick="toggleAddressField(true)"> Доставка</label>
              <label><input type="radio" name="deliveryType" value="Самовывоз" onclick="toggleAddressField(false)"> Самовывоз</label>
            </div>
          </div>

          <div class="form-group" id="addressGroup">
            <label for="userAddress">Адрес доставки *</label>
            <input type="text" id="userAddress" required placeholder="г. Москва, ул. Пушкина, д. 10">
          </div>

          <div class="form-group">
            <label for="userComment">Комментарий к заказу</label>
            <textarea id="userComment" rows="3" placeholder="Пожелания по времени и доставке..."></textarea>
          </div>

          <div class="cart-summary">
            <span>Итого к оплате:</span>
            <strong id="cartPageTotal">0 ₽</strong>
          </div>

          <button type="submit" id="submitBtn" class="submit-order-btn">Подтвердить заказ</button>
        </form>
      </section>
    </div>
  </main>

  <!-- Контейнер для toast-уведомлений -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="script.js"></script>
</body>
</html>
